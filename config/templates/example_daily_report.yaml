# 示例分析任务配置
name: "每日设备运行报告"
description: "从达梦数据库获取设备数据，AI分析后生成Word报告"
enabled: false  # 默认关闭，配置好数据库后开启

schedule:
  cron: "0 8 * * *"   # 每天8点

database:
  host: "192.168.1.10"
  standby: "192.168.1.11"
  port: 5236
  username: "dmdb"
  password: ""         # 请填写实际密码
  database: "lczx"

sql: |
  SELECT * FROM device_status WHERE record_date = CURRENT_DATE

prompt: |
  你是航空发动机维修工厂的设备分析专家。请根据以下设备运行数据：
  1. 总结整体运行状况
  2. 指出异常设备
  3. 给出维护建议
  
  数据：
  {{data}}

output:
  format: "docx"
  template: ""         # 可选，有则按模板填充
  filename: "设备运行日报_{{date}}.docx"
  save_path: "output/reports/"

notify:
  enabled: false
