# AIDE 数据库Schema定义
# 开发者维护此文件，随升级包更新
# 用户也可以通过管理界面自动从数据库提取

tables:
  - name: "device_status"
    comment: "设备运行状态表"
    columns:
      - name: "device_name"
        type: "VARCHAR"
        comment: "设备名称"
      - name: "device_code"
        type: "VARCHAR"
        comment: "设备编号"
      - name: "run_hours"
        type: "DECIMAL"
        comment: "运行时长（小时）"
      - name: "fault_count"
        type: "INTEGER"
        comment: "故障次数"
      - name: "record_date"
        type: "DATE"
        comment: "记录日期"
      - name: "workshop"
        type: "VARCHAR"
        comment: "所属车间"
      - name: "status"
        type: "VARCHAR"
        comment: "设备状态(运行/停机/维修)"

  - name: "maintenance_record"
    comment: "维修记录表"
    columns:
      - name: "id"
        type: "INTEGER"
        comment: "记录ID"
      - name: "device_code"
        type: "VARCHAR"
        comment: "设备编号"
      - name: "fault_type"
        type: "VARCHAR"
        comment: "故障类型"
      - name: "fault_description"
        type: "VARCHAR"
        comment: "故障描述"
      - name: "repair_date"
        type: "DATE"
        comment: "维修日期"
      - name: "repair_duration"
        type: "DECIMAL"
        comment: "维修耗时（小时）"
      - name: "repairer"
        type: "VARCHAR"
        comment: "维修人员"
      - name: "repair_result"
        type: "VARCHAR"
        comment: "维修结果(完成/部分完成/待件)"

  - name: "inspection_record"
    comment: "巡检记录表"
    columns:
      - name: "id"
        type: "INTEGER"
        comment: "记录ID"
      - name: "device_code"
        type: "VARCHAR"
        comment: "设备编号"
      - name: "inspection_date"
        type: "DATE"
        comment: "巡检日期"
      - name: "inspector"
        type: "VARCHAR"
        comment: "巡检人员"
      - name: "findings"
        type: "VARCHAR"
        comment: "巡检发现"
      - name: "severity"
        type: "VARCHAR"
        comment: "严重程度(正常/注意/异常/紧急)"

  - name: "spare_part"
    comment: "备件库存表"
    columns:
      - name: "part_code"
        type: "VARCHAR"
        comment: "备件编号"
      - name: "part_name"
        type: "VARCHAR"
        comment: "备件名称"
      - name: "category"
        type: "VARCHAR"
        comment: "分类"
      - name: "stock_quantity"
        type: "INTEGER"
        comment: "库存数量"
      - name: "min_quantity"
        type: "INTEGER"
        comment: "最低库存"
      - name: "unit_price"
        type: "DECIMAL"
        comment: "单价"
      - name: "supplier"
        type: "VARCHAR"
        comment: "供应商"

relations:
  - from: "device_status.device_code"
    to: "maintenance_record.device_code"
    comment: "设备编号关联"
  - from: "device_status.device_code"
    to: "inspection_record.device_code"
    comment: "设备编号关联"
